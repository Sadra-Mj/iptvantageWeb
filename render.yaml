services:
  - type: web
    name: iptvantage-payment-bot
    runtime: node
    plan: free
    rootDir: PaymentBot
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Europe/Nicosia
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: iptvantage
      - key: PAYMENT_METHOD_NAME
        sync: false
      - key: PAYMENT_RECIPIENT
        sync: false
      - key: PAYMENT_IBAN
        sync: false
      - key: PAYMENT_INSTRUCTIONS
        sync: false
